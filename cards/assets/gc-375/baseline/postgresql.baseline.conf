# gc-375 SEALED baseline config. Do not modify this file.
# Deliberately latency-hostile: tiny buffers and aggressive checkpointing produce p95 spikes.
listen_addresses = '*'
max_connections = 50
shared_buffers = 8MB
work_mem = 64kB
wal_buffers = 64kB
synchronous_commit = on
checkpoint_timeout = 30s
max_wal_size = 64MB
checkpoint_completion_target = 0.5
