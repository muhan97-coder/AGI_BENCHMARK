# gc-377 starter nginx config -- this is your deliverable. It proxies but never caches,
# so every request pays the upstream's 250ms penalty and the sealed hit-rate check fails.
worker_processes 1;
events { worker_connections 128; }
http {
  server {
    listen 80;
    location / {
      proxy_pass http://gc377app:9000;
    }
  }
}
