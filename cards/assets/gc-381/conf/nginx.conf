# gc-381 starter nginx config -- this is your deliverable. A plain pass-through proxy:
# every request pays 200ms at the origin, and the edge dies the moment the origin dies.
# The sealed SLO check requires caching AND stale-serving when the origin is down.
worker_processes 1;
events { worker_connections 256; }
http {
  server {
    listen 80;
    location / {
      proxy_pass http://gc381app:9000;
    }
  }
}
