; gc-380 TUNED pgbouncer config -- this is your main deliverable. Edit freely.
; Starter values are deliberately undersized; the sealed connection ladder will fail.
[databases]
bench = host=gc380pg port=5432 dbname=bench

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
default_pool_size = 2
max_client_conn = 40
